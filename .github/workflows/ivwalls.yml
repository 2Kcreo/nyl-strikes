name: IV walls (research)
on:
  push:
    branches: [main]
    paths: ["ivwalls.py", "ivwalls.txt", "ivtest.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: strikes
  cancel-in-progress: false
jobs:
  ivwalls:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - env: {THETADATA_API_KEY: "${{ secrets.THETADATA_API_KEY }}"}
        run: python ivwalls.py $(cat ivwalls.txt)
      - run: grep -q -- "--today" ivwalls.txt || python ivtest.py
      - run: |
          git config user.name "nyl-bot"; git config user.email "nyl-bot@users.noreply.github.com"
          git add -A research/ivwalls; if [ -d docs/data/ivwalls ]; then git add docs/data/ivwalls; fi; git commit -m "IV walls $(cat ivwalls.txt)" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push && break; sleep 5; done
