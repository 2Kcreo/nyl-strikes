name: Build NYL strikes
on:
  schedule:
    # GitHub often starts scheduled runs late, so try every 15 min from ~6:30 to ~11:45 ET.
    # Any run after 9:30 ET builds the same locked list (it uses the 9:30 open), so the first one that fires wins.
    - cron: "*/15 11-16 * * 1-5"
  push:
    branches: [main]
    paths: ["strikes.py", "engine.py", "feeds.py", ".github/workflows/strikes.yml", "trigger.txt"]
  workflow_dispatch:
    inputs:
      day:
        description: "Date to build (YYYY-MM-DD), blank = today"
        required: false
permissions:
  contents: write
concurrency:
  group: strikes
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build strikes
        env:
          THETADATA_API_KEY: ${{ secrets.THETADATA_API_KEY }}
        run: python strikes.py ${{ github.event.inputs.day || '' }}
      - name: Save to the website
        run: |
          git config user.name "vex-bot"
          git config user.email "vex-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || (git commit -m "strikes $(date -u +%F)" && git push)
