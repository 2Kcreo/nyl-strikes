name: Ratio test (research)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ratio_test.py"]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python ratio_test.py
      - run: |
          git config user.name "nyl-bot"; git config user.email "nyl-bot@users.noreply.github.com"
          git add research/ratio_test_results.json; git commit -m "ratio test results" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push && break; sleep 5; done
