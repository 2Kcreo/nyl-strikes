name: Backtest NDX vs QQQ
on:
  push:
    branches: [main]
    paths: ["backtest.py", ".github/workflows/backtest.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: strikes
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run backtest
        env:
          THETADATA_API_KEY: ${{ secrets.THETADATA_API_KEY }}
        run: python backtest.py
      - name: Save results
        run: |
          git config user.name "nyl-bot"
          git config user.email "nyl-bot@users.noreply.github.com"
          git pull --rebase -q || true
          git add results
          git diff --cached --quiet || (git commit -m "backtest results" && git push)
