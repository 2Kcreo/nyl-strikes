name: Diag
on:
  push:
    branches: [main]
    paths: ["diag.py"]
permissions:
  contents: read
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - env: {THETADATA_API_KEY: "${{ secrets.THETADATA_API_KEY }}"}
        run: python diag.py
