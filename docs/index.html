<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NYL Strikes</title>
<meta name="theme-color" content="#0a0713">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{--bg:#f7f5ff;--surf:#ffffff;--surf2:#eeeaff;--ink:#1a1433;--dim:#5d567a;--line:#e0daf5;--acc:#5a3cf2;--acc2:#c43c9d;--accInk:#ffffff;--gold:#94690c;--glow:rgba(90,60,242,.13)}
:root[data-theme="dark"]{--bg:#0a0713;--surf:#120e1f;--surf2:#1a1530;--ink:#f2eeff;--dim:#a7a0c4;--line:#2a2342;--acc:#a083ff;--acc2:#ff7ad9;--accInk:#0a0713;--gold:#e8c46b;--glow:rgba(160,131,255,.3)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0713;--surf:#120e1f;--surf2:#1a1530;--ink:#f2eeff;--dim:#a7a0c4;--line:#2a2342;--acc:#a083ff;--acc2:#ff7ad9;--accInk:#0a0713;--gold:#e8c46b;--glow:rgba(160,131,255,.3)}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.45 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
button,select{font:inherit;cursor:pointer;color:inherit}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:overlay;z-index:30}
.blob{position:fixed;width:420px;height:420px;border-radius:50%;top:180px;left:50%;margin-left:-320px;background:radial-gradient(circle,var(--glow),transparent 68%);filter:blur(10px);animation:float 12s ease-in-out infinite;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:12px 16px calc(28px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 0 14px}
.logo{display:flex;align-items:center;gap:10px}
.logo .ic{width:32px;height:32px;border-radius:9px;background:var(--acc);display:grid;place-items:center;box-shadow:0 6px 20px -6px var(--acc)}
h1{margin:0;font:700 20px/1 'Space Grotesk',Inter,sans-serif;letter-spacing:.04em}h1 i{font-style:normal;color:var(--acc)}
.iconBtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surf);display:grid;place-items:center}
.sub{color:var(--dim);font-size:13px;margin:0 0 10px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:5px 11px;border-radius:999px;background:var(--surf2);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--acc);margin-bottom:12px}
.pill.pre{color:var(--gold)}
.dot{position:relative;width:7px;height:7px}.dot i{position:absolute;inset:0;border-radius:50%;background:currentColor}.dot i+i{animation:ping 1.6s ease-out infinite}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.ringWrap{position:relative;border-radius:17px;padding:1.5px;overflow:hidden;background:var(--line);margin-bottom:12px}
.ring{position:absolute;inset:-60%;background:conic-gradient(from var(--ang),transparent 0deg,transparent 250deg,var(--acc) 320deg,var(--acc2) 345deg,transparent 360deg);animation:spin 6s linear infinite}
.ringWrap .card{position:relative;margin:0;border:0;border-radius:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sel{position:relative;flex:1 1 130px}
.sel select{width:100%;min-height:44px;padding:0 34px 0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surf);appearance:none;-webkit-appearance:none}
.sel::after{content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.btn{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surf);font-weight:600}
.btn[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.copy{width:100%;margin-top:10px;min-height:50px;border:0;border-radius:12px;background:var(--acc);color:var(--accInk);font-weight:700;font-size:16px;box-shadow:0 10px 28px -10px var(--acc);transition:transform .15s}
.copy:active{transform:scale(.98)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px;color:var(--dim)}
.meta b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.meta b.gold{color:var(--gold)}.meta b.vio{color:var(--acc)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 4px;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li .k{font:700 16px 'JetBrains Mono',ui-monospace,Menlo,monospace;display:flex;align-items:center;gap:6px;white-space:nowrap}
li .k svg{color:var(--gold)}
.tags{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:3px}
.tag{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;font-weight:700;padding:1px 5px;border-radius:5px;background:var(--surf2);color:var(--dim)}
.tag.WALL{background:var(--acc2);color:var(--accInk)}.tag.OI{background:var(--acc);color:var(--accInk)}.tag.EM{background:transparent;color:var(--gold)}
.src{font-size:10.5px;font-weight:700;color:var(--dim);margin-right:2px}.src.both{color:var(--acc)}
.q{font-size:11.5px;color:var(--dim);min-width:46px;text-align:right}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hd b{font:600 11px Inter,sans-serif;letter-spacing:.16em;color:var(--dim)}
.empty{color:var(--dim);text-align:center;padding:18px 0;justify-content:center}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:var(--acc);color:var(--accInk);padding:11px 18px;border-radius:12px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:40;box-shadow:0 12px 30px -10px var(--acc)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes spin{to{--ang:360deg}}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(18px,-14px) scale(1.08)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg class="grain" aria-hidden="true" width="100%" height="100%"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
<div class="blob" aria-hidden="true"></div>
<main>
  <header class="top">
    <div class="logo"><span class="ic"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 14l4.5-5 3 3L17 5" stroke="var(--accInk)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span><h1>N<i>Y</i>L STRIKES</h1></div>
    <button type="button" class="iconBtn" id="theme" aria-label="Switch light or dark mode"><svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true"><path id="themeIcon" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </header>
  <p class="sub">Today's key QQQ strikes. Tap Copy, paste into "Key QQQ strikes" in TradingView.</p>
  <span class="pill" id="pill"><span class="dot"><i></i><i></i></span><span id="pillText">Loading…</span></span>

  <div class="ringWrap"><div class="ring" aria-hidden="true"></div>
    <div class="card">
      <div class="row">
        <label class="sel"><span hidden>Day</span><select id="day" aria-label="Day"></select></label>
        <label class="sel"><span hidden>Strikes per layer</span><select id="dens" aria-label="Strikes per layer"><option value="5">5 per layer</option><option value="8">8 per layer</option><option value="12">12 per layer</option><option value="20">20 per layer</option></select></label>
        <button type="button" class="btn" id="starBtn" aria-pressed="false">★ only</button>
      </div>
      <button type="button" class="copy" id="copy">Copy strikes</button>
    </div>
  </div>

  <div class="card"><div class="meta" id="meta"></div></div>
  <div class="card"><ul id="list"><li class="empty">Loading…</li></ul></div>
  <div class="card" id="ndxCard" hidden>
    <div class="hd"><b>NDX / NDXP LEVELS</b><button type="button" class="btn" id="copyNdx" style="min-height:36px;font-size:13px">Copy NDX</button></div>
    <p class="sub" id="ndxSub" style="margin:6px 0 6px"></p>
    <ul id="ndxList"></ul>
  </div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var $=function(i){return document.getElementById(i)}, days={}, starOnly=false;
  function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function put(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
  var SUN="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4", MOON="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z";
  function curTheme(){return document.documentElement.getAttribute("data-theme")||"dark"}
  function paintTheme(){var dark=curTheme()==="dark";$("themeIcon").setAttribute("d",dark?SUN:MOON);var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=dark?"#0a0713":"#f7f5ff"}
  document.documentElement.setAttribute("data-theme",get("nyl_theme")||"dark");paintTheme();
  $("theme").onclick=function(){var t=curTheme()==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);put("nyl_theme",t);paintTheme()};

  $("dens").value=get("vexs_dens")||"12";starOnly=get("vexs_star")==="1";
  function paintStar(){$("starBtn").setAttribute("aria-pressed",starOnly)}paintStar();
  var STAR='<svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z" fill="currentColor"/></svg>';
  function fmt(k){k=Number(k);return k%1?String(+k.toFixed(2)):String(k)}
  function tagHtml(ts){return ts.map(function(t){return '<span class="tag '+esc(t)+'">'+esc(t)+'</span>'}).join("")}
  function current(){var d=days[$("day").value];if(!d)return[];var n=+$("dens").value;
    return (d.strikes||[]).filter(function(s){return s.dens<=n&&(!starOnly||s.star)}).sort(function(a,b){return b.k-a.k})}
  function status(d){var s=d.spot_src||"", m=s.match(/\d{1,2}:\d{2}/);
    if(/backtest/.test(s))return{t:"Backtest · built as of "+(m?m[0].replace(/^0/,""):"9:25")+" ET, nothing after used",pre:true};
    if(/locked/.test(s))return{t:"Final · locked at the 9:30 open",pre:false};
    if(/pre-market/.test(s))return{t:"Pre-market "+(m?m[0]+" ":"")+"· updates at the open",pre:true};
    return{t:"From the prior close · updates pre-market",pre:true}}
  function render(){
    var d=days[$("day").value];
    if(!d){$("list").innerHTML='<li class="empty">No strikes saved yet. They appear here every weekday morning.</li>';$("meta").innerHTML="";$("pillText").textContent="Waiting for the first build";return}
    var st=status(d);$("pillText").textContent=st.t;$("pill").classList.toggle("pre",st.pre);
    var ks=current(), spot=+d.spot, em=+d.em, flip=(d.flip||[])[0];
    $("list").innerHTML=ks.length?ks.map(function(s){return '<li><span class="k">'+(s.star?STAR:'<span style="width:12px"></span>')+fmt(s.k)+'</span><span class="tags">'+tagHtml(s.tags)+'</span></li>'}).join(""):'<li class="empty">No strikes match.</li>';
    var m=[["QQQ",spot.toFixed(2)+"  ·  "+(d.spot_src||"").replace(/\s*\(.*\)$/,""),""],
      ["Implied move","±"+em.toFixed(2)+"  ("+(spot-em).toFixed(2)+" – "+(spot+em).toFixed(2)+")","gold"],
      ["Gamma flip",flip!=null?flip.toFixed(2):"—","vio"],["Open interest",d.oi,""],["Built",d.built,""],["Strikes",ks.length,""]];
    $("meta").innerHTML=m.map(function(x){return "<span>"+x[0]+"</span><b class='"+x[2]+"'>"+esc(x[1])+"</b>"}).join("");
    var nx=d.ndx;$("ndxCard").hidden=!nx;
    if(nx){$("ndxSub").textContent="NDX "+Number(nx.spot).toLocaleString("en-US")+" · QQQ equivalent on the right";
      $("ndxList").innerHTML=nx.strikes.map(function(s){return '<li><span class="k">'+esc(s.k)+'</span><span class="tags"><span class="src'+(s.src.length>1?' both':'')+'">'+esc(s.src.join("+"))+'</span>'+tagHtml(s.tags)+'</span><span class="q mono">'+(s.qqq!=null?Number(s.qqq).toFixed(2):"")+'</span></li>'}).join("")}
  }
  var tT;function toast(t){var e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(tT);tT=setTimeout(function(){e.classList.remove("show")},1800)}
  function copyText(txt,msg){if(!txt)return;var ok=function(){toast(msg)};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok,fb);else fb();
    function fb(){var ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");ok()}catch(e){prompt("Copy:",txt)}ta.remove()}}
  $("copy").onclick=function(){var ks=current();copyText(ks.map(function(s){return fmt(s.k)}).join("\n"),"Copied "+ks.length+" strikes")};
  $("copyNdx").onclick=function(){var d=days[$("day").value];if(!d||!d.ndx)return;copyText(d.ndx.strikes.map(function(s){return s.k}).join("\n"),"Copied "+d.ndx.strikes.length+" NDX levels")};
  $("dens").onchange=function(){put("vexs_dens",this.value);render()};
  $("starBtn").onclick=function(){starOnly=!starOnly;paintStar();put("vexs_star",starOnly?"1":"0");render()};
  $("day").onchange=render;
  function load(){
    fetch("data/index.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(list){
      return Promise.all(list.slice(0,60).map(function(d){return fetch("data/"+d+".json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).catch(function(){return null})}));
    }).then(function(arr){
      var keep=$("day").value;days={};arr.forEach(function(v){if(v)days[v.day]=v});
      var ks=Object.keys(days).sort().reverse();
      $("day").innerHTML=ks.map(function(k){return '<option value="'+k+'">'+new Date(k+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})+'</option>'}).join("");
      if(keep&&days[keep])$("day").value=keep;render();
    }).catch(function(){$("list").innerHTML='<li class="empty">Couldn’t load strikes. Check your connection and refresh.</li>'});
  }
  load();setInterval(load,300000);
})();
</script>
</body>
</html>
